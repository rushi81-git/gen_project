version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: genai_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genai_secure_pass_123}
      POSTGRES_DB: ${POSTGRES_DB:-genai_monitoring}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genai_user -d genai_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genai_backend_prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-genai_user}:${POSTGRES_PASSWORD:-genai_secure_pass_123}@db:5432/${POSTGRES_DB:-genai_monitoring}
      - HF_API_TOKEN=${HF_API_TOKEN}
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: genai_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
